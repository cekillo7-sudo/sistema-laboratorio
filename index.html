<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Químico Metalúrgico</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #1F4E79; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { width: 100%; background-color: #1F4E79; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #153754; }
        button:disabled { background-color: #94A3B8; cursor: not-allowed; }
        .alert { margin-top: 15px; padding: 12px; border-radius: 4px; text-align: center; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .download-btn { display: inline-block; margin-top: 10px; padding: 10px 18px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .download-btn:hover { background-color: #218838; }
        .auto-hint { font-size: 12px; color: #0284c7; margin-top: 3px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Muestra de Ensayo</h2>
    
    <form id="sampleForm" onsubmit="event.preventDefault(); enviarDatos();">
        <div class="form-group">
            <label>Identificación / Código de Muestra:</label>
            <!-- Al salir de este campo (onblur), busca automáticamente en la recepción -->
            <input type="text" id="codigo" placeholder="Ej. JR-1769-cuarzosa" required onblur="buscarRecepcionAutomatica()">
            <small class="auto-hint">💡 Al salir del campo se cargará el cliente y la fecha automáticamente.</small>
        </div>

        <div class="form-group">
            <label>Cliente:</label>
            <input type="text" id="cliente" placeholder="Ej. Mily" required>
        </div>

        <div class="form-group">
            <label>Fecha y Hora de Recepción:</label>
            <input type="datetime-local" id="fecha_recepcion" required>
        </div>

        <div class="form-group">
            <label>Peso Au Balanza Analítica (g) [5 decimales]:</label>
            <input type="text" inputmode="decimal" id="peso_au" placeholder="0.00012" required>
        </div>

        <div class="form-group">
            <label>Peso Muestra (g) [2 decimales]:</label>
            <input type="text" inputmode="decimal" id="peso_muestra" value="10.00" placeholder="10.00" required>
        </div>

        <div class="form-group">
            <label>Porcentaje (%):</label>
            <input type="text" inputmode="decimal" id="porcentaje" value="100" required>
        </div>

        <button type="submit" id="btnGuardar">💾 Guardar y Generar Informe</button>
    </form>

    <div id="mensaje" class="alert"></div>
</div>

<script>
    window.onload = function() {
        const ahora = new Date();
        ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
        document.getElementById("fecha_recepcion").value = ahora.toISOString().slice(0, 16);
    };

    // Búsqueda 100% automática al terminar de escribir el código
    async function buscarRecepcionAutomatica() {
        const codigo = document.getElementById("codigo").value.trim();
        if (!codigo) return;

        try {
            const respuesta = await fetch(`/api/recepcion/buscar/${encodeURIComponent(codigo)}`);
            const resultado = await respuesta.json();

            if (resultado.status === "ok" && resultado.recepcion) {
                const rec = resultado.recepcion;
                if (rec.cliente) {
                    document.getElementById("cliente").value = rec.cliente;
                }
                if (rec.fecha_hora_recepcion) {
                    const fechaFmt = rec.fecha_hora_recepcion.replace(' ', 'T').substring(0, 16);
                    document.getElementById("fecha_recepcion").value = fechaFmt;
                }
            }
        } catch (error) {
            console.error("Error al buscar la recepción:", error);
        }
    }

    async function enviarDatos() {
        const mensajeDiv = document.getElementById("mensaje");
        const btn = document.getElementById("btnGuardar");
        mensajeDiv.style.display = "none";

        const cliente = document.getElementById("cliente").value.trim();
        const codigo = document.getElementById("codigo").value.trim();
        const fecha_recepcion = document.getElementById("fecha_recepcion").value;
        
        const parseNum = (val) => parseFloat(val.replace(',', '.')) || 0;

        const peso_au = parseNum(document.getElementById("peso_au").value);
        const peso_muestra = parseNum(document.getElementById("peso_muestra").value) || 10.0;
        const porcentaje = parseNum(document.getElementById("porcentaje").value) || 100;

        if (!cliente || !codigo) {
            alert("Por favor completa todos los campos requeridos.");
            return;
        }

        const datos = { cliente, codigo, fecha_recepcion, peso_au, peso_muestra, porcentaje };

        btn.disabled = true;
        btn.innerText = "⏳ Generando informe...";

        try {
            const respuesta = await fetch("/guardar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });

            const resultado = await respuesta.json();

            if (resultado.status === "ok") {
                mensajeDiv.className = "alert success";
                mensajeDiv.innerHTML = `
                    ✅ <strong>${resultado.mensaje}</strong><br><br>
                    <strong>Recepción:</strong> ${resultado.fecha_recepcion}<br>
                    <strong>Emisión:</strong> ${resultado.fecha_emision}<br>
                    Ley Au: <strong>${resultado.ley_calculada} gr/tm</strong><br><br>
                    <a class="download-btn" href="${resultado.url_descarga}" target="_blank">📥 Descargar PDF Oficial</a>
                `;
            } else {
                mensajeDiv.className = "alert error";
                mensajeDiv.innerHTML = `❌ ${resultado.mensaje}`;
            }
            mensajeDiv.style.display = "block";
        } catch (error) {
            mensajeDiv.className = "alert error";
            mensajeDiv.innerHTML = "❌ Error de conexión con el servidor. Inténtalo de nuevo.";
            mensajeDiv.style.display = "block";
        } finally {
            btn.disabled = false;
            btn.innerText = "💾 Guardar y Generar Informe";
        }
    }
</script>

</body>
</html>
